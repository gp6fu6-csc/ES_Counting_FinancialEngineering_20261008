<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESCounting V4 · 訓練</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div id="app" v-cloak>
  <header class="topbar">
    <h1>ESCounting V4<span>訓練 Training</span></h1>
    <nav aria-label="頁面">
      <a href="/ui/calibration.html">校正</a>
      <a href="/ui/training.html" class="active" aria-current="page">訓練</a>
      <a href="/ui/results.html">結果</a>
    </nav>
    <label class="apikey">API Key
      <input type="password" v-model="apiKey" @change="saveKey" autocomplete="off" placeholder="(本機可留空)">
    </label>
  </header>

  <main class="layout results">
    <aside class="panel side" aria-label="專案">
      <label class="field"><span>選擇資料夾</span>
        <select v-model="caseId" @change="refresh">
          <option disabled value="">— 選擇專案 —</option>
          <option v-for="c in cases" :key="c" :value="c">{{ c }}</option>
        </select>
      </label>
      <label class="field"><span>訓練裝置</span>
        <select v-model="device">
          <option value="cuda">GPU (CUDA，無 GPU 時自動改用 CPU)</option>
          <option value="cpu">CPU</option>
        </select>
      </label>
      <p class="hint">依序完成 0 → 4。每一步完成後，下一步的按鈕才會啟用。同一時間只能執行一個工作。</p>
    </aside>

    <section class="panel main" aria-label="訓練步驟">
      <ol class="steps" v-if="caseId">
        <li v-for="s in steps" :key="s.key" :class="{ done: status[s.key], next: s.key === nextStep }">
          <div class="step-head">
            <span class="badge">{{ status[s.key] ? '✔ 已完成' : (s.key === nextStep ? '▶ 下一步' : '未完成') }}</span>
            <strong>{{ s.title }}</strong>
          </div>
          <p class="hint">{{ s.desc }}</p>
          <a v-if="s.key === 'calibrate'" :href="'/ui/calibration.html?case=' + encodeURIComponent(caseId)">
            <button>前往校正頁</button></a>
          <a v-else-if="s.key === 'results'" :href="'/ui/results.html?case=' + encodeURIComponent(caseId)">
            <button :disabled="!status.select">前往結果頁</button></a>
          <button v-else @click="run(s.key)" :disabled="!canRun(s.key)">
            {{ status[s.key] ? '重新執行' : '執行' }}{{ s.title }}</button>
        </li>
      </ol>
      <p class="error" v-if="error" role="alert">{{ error }}</p>
      <div v-if="job.step">
        <h2 class="job-title">工作：{{ job.case }} / {{ job.step }} ·
          <span :class="job.status === 'failed' ? 'error' : 'ok'">{{ statusText }}</span></h2>
        <pre class="log" ref="log" aria-live="polite">{{ job.log.join('\n') }}</pre>
      </div>
    </section>
  </main>
</div>
<script src="/ui/vendor/vue.global.prod.js"></script>
<script src="/ui/common.js"></script>
<script src="/ui/training.js"></script>
</body>
</html>
