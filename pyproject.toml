[project]
name = "escount"
version = "0.1.0"
description = "ESCounting V4: electrical-steel lamination counting with financial-engineering indicators"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
# Pinned exact versions; every dependency must have a permissive licence (scripts/check_licenses.py).
dependencies = [
    "numpy==2.2.6",
    "opencv-python-headless==4.13.0.92",
    "scipy==1.16.3",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "xgboost==3.2.0",
    "scikit-learn==1.9.1",
    "pyarrow==26.0.0",
    "lightgbm==4.7.0",
    "optuna==5.0.0",
]

[project.scripts]
escount = "escount.cli:main"

[dependency-groups]
dev = [
    "pip-licenses==5.5.5",
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
